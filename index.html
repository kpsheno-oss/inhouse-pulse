<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inhouse Пульс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@300;400;600;700&family=Oswald:wght@300&display=swap">
<style>
body{margin:0}
:root{
  color-scheme:dark;
  --bg:#161616; --card:#212121; --card2:#2A2A2A; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#F4F4F4; --ink2:#BDBDBD; --muted:#868686;
  --y:#FFD400; --y-soft:rgba(255,212,0,.14);
  --red:#FF5C50; --red-soft:rgba(255,92,80,.15);
  --orange:#FF9B3D; --orange-soft:rgba(255,155,61,.15);
  --green:#3DD08A; --green-soft:rgba(61,208,138,.14);
  --grey-soft:rgba(255,255,255,.07);
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:14px 100px}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
button:focus-visible,.row:focus-visible{outline:2px solid var(--y);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.logo{position:relative;font-family:"Oswald","Arial Narrow",sans-serif;font-weight:300;font-size:15px;line-height:1.05;letter-spacing:.2em;padding:6px 0 6px 10px;color:var(--ink)}
.logo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;border:1px solid var(--y);border-right:0}
.logo i{color:var(--y);font-style:normal}
.upd{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);text-align:right}
.refresh{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--y);display:grid;place-items:center;cursor:pointer;flex:none}
.refresh svg{width:17px;height:17px}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.ttl{position:relative;padding-left:22px;margin-bottom:18px}
.ttl::before{content:"";position:absolute;left:0;top:2px;width:12px;height:12px;border-left:1px solid var(--y);border-bottom:1px solid var(--y)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,5.6vw,34px);line-height:1.08;text-transform:uppercase;margin:0;text-wrap:balance;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--y)}
.ttl p{margin:6px 0 0;color:var(--muted);font-size:12.5px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(22,22,22,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 10.5px var(--body);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--y)}
@media (min-width:860px){
  nav.tabs{position:static;background:none;backdrop-filter:none;border:0;border-bottom:1px solid var(--line);padding:0;margin-bottom:26px;gap:28px;justify-content:flex-start}
  nav.tabs button{flex:none;flex-direction:row;gap:8px;font-size:12px;padding:12px 0;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button[aria-selected="true"]{border-bottom-color:var(--y)}
  nav.tabs button svg{width:18px;height:18px}
  .wrap{padding-block:24px 56px}
}

/* layout */
section.view{display:grid;gap:12px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:860px){.kpis{grid-template-columns:2fr 1fr 1fr}.two{grid-template-columns:1.35fr 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.hero{grid-column:1/-1;position:relative;border-radius:22px 22px 22px 72px;padding:20px 20px 22px 24px;background:linear-gradient(160deg,#262626,#1d1d1d)}
@media (min-width:860px){.hero{grid-column:auto}}
.hero::after{content:"";position:absolute;right:-5px;top:-5px;width:9px;height:9px;background:var(--y);transform:rotate(45deg);border-radius:1px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font-weight:300;color:var(--y);font-size:clamp(34px,10vw,52px);line-height:1;margin-top:10px;letter-spacing:-.02em}
.mid{font-weight:300;font-size:clamp(24px,6.5vw,32px);line-height:1.05;margin-top:8px;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--ink2);margin-top:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
h2{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-family:var(--body);font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line2);background:none;color:var(--ink2);font:600 12px var(--body);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--y);color:#161616;border-color:var(--y)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-red{background:var(--red-soft);color:var(--red)} .p-orange{background:var(--orange-soft);color:var(--orange)}
.p-green{background:var(--green-soft);color:var(--green)} .p-grey{background:var(--grey-soft);color:var(--muted)}
.p-y{background:var(--y-soft);color:var(--y)}
.more{background:none;border:0;border-bottom:1px solid var(--y);color:var(--y);font:500 11px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:0 0 3px;margin-top:14px;cursor:pointer}
.more::after{content:" ›";font-family:var(--body);font-weight:700}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:13px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%}
.row:first-child{border-top:0;padding-top:2px}
.row.click{cursor:pointer}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:700;text-align:right}
.bar{grid-column:1/-1;height:4px;background:var(--grey-soft);border-radius:2px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:2px}
.detail{grid-column:1/-1;margin-top:10px;background:var(--card2);border-radius:14px 14px 14px 32px;padding:12px 14px;display:grid;gap:10px;cursor:auto}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px}
.it .m{font-weight:700;text-transform:capitalize}
.it .n{grid-column:1/-1;color:var(--y);opacity:.85}

.chart{width:100%;display:block}
.chart text{fill:var(--muted);font:11px var(--body);font-variant-numeric:tabular-nums}
.gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.note{font-size:12px;color:var(--muted);margin-top:8px}

.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0;padding-top:2px}
.track{grid-column:1/-1;position:relative;height:6px;background:var(--grey-soft);border-radius:3px;margin-top:3px}
.track .norm{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--green);border-right:1px dashed var(--green);background:rgba(61,208,138,.10)}
.track .pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}

.search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:500 14px var(--body);padding:10px 12px;margin-bottom:12px}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--y)}
.copy{justify-self:start;background:var(--y);color:#161616;border:0;border-radius:999px;font:700 12px var(--body);padding:9px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.copy svg{width:15px;height:15px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--y);color:#161616;font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.fallback{width:100%;min-height:150px;background:var(--bg);color:var(--ink);border:1px solid var(--y);border-radius:10px;font:13px var(--body);padding:10px}
.state{padding:48px 16px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--ink);font-family:var(--display);font-weight:500;text-transform:uppercase;font-size:13px;letter-spacing:.06em;margin-bottom:8px}
.demo{font-size:11px;color:var(--muted);border:1px dashed var(--line2);border-radius:10px;padding:8px 12px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.refresh.spin svg{animation:none}}
/* закрытие: рабочее */
.cballs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.cball{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card2);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.cball[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:-1px}
.cball .n{font-weight:300;font-size:24px;line-height:1.1}
.cball .l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cball .x{font-size:11px;color:var(--red);font-weight:700}
.cdots{display:inline-flex;gap:3px}
.cdots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line2)}
.cdots i.done{background:var(--green);border-color:var(--green)}
.cdots i.skip{border-style:dashed;opacity:.6}
.cdots i.cur{border-color:var(--c);background:var(--c);opacity:.85}
.cact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.cact .search{flex:1;min-width:0}
.copy.ghost{background:none;color:var(--y);border:1px solid var(--y)}
.copy:disabled{opacity:.5}
.clink{background:none;border:0;color:var(--muted);font:600 12px var(--body);text-decoration:underline;cursor:pointer;padding:4px 2px}
.cnote{background:var(--card2);border-left:3px solid var(--y);border-radius:4px 12px 12px 4px;padding:10px 12px;font-size:13px}
.csteps{display:flex;flex-direction:column;background:var(--card2);border-radius:16px;padding:4px 12px}
.cstep{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cstep:first-child{border-top:0}
.cstep>i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2)}
.cstep.done>i{background:var(--green);border-color:var(--green)}
.cstep.skip>i{border-style:dashed}.cstep.skip .t{color:var(--muted);text-decoration:line-through}
.cstep.cur>i{background:var(--c);border-color:var(--c)}
.cstep .t{font-weight:600;font-size:13px}.cstep .s{font-size:11.5px;color:var(--muted)}
.cstep .chip{margin:0;padding:6px 11px}
.cscrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.csheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;z-index:31;background:var(--bg);border-top:1px solid var(--y);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-width:720px;margin:0 auto}
.cgrab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto}
.cform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}
.cform label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cform input,.cform select{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:500 14px var(--body);padding:9px 10px;text-transform:none;letter-spacing:0}
textarea.search{resize:vertical;min-height:70px}
.cduty{cursor:pointer;align-items:center}
.cduty input{width:20px;height:20px;accent-color:var(--y)}
.cduty.ok .t{color:var(--muted);text-decoration:line-through}
.cprose{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.cprose p,.cprose ul{margin:0}.cprose ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.cprose h3{margin:6px 0 0;font:500 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--y)}
.crow .t{font-size:14px}

</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">INHOUSE<i>.</i><br>MEDIA</div>
    <div class="upd"><span id="upd">Загрузка…</span>
      <button class="refresh" id="refresh" aria-label="Обновить данные"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-debt" data-v="debt" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Дебиторка</button>
    <button role="tab" id="tab-load" data-v="load" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><path d="M16 5.5a3 3 0 010 5.6M18.5 15c1.4.7 2.3 2.4 2.5 5"/></svg>Нагрузка</button>
    <button role="tab" id="tab-close" data-v="close" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 12l2.5 2.5L16 9"/></svg>Закрытие</button>
    <button role="tab" id="tab-asst" data-v="asst" aria-selected="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h7M9 14h7M9 18h4"/></svg>Ассистент</button>
  </nav>

  <div class="ttl"><h1 id="title"></h1><p id="subtitle"></p></div>
  <div id="demoNote" class="demo" hidden>Демо-режим: снимок данных из загруженных таблиц. В Telegram страница берёт данные из Google Таблиц напрямую.<div class="chips" style="margin:8px 0 0"><button class="chip" id="asAdmin" aria-pressed="true">Полный доступ</button><button class="chip" id="asManager" aria-pressed="false">Как видит менеджер</button></div></div>
  <div id="state" class="state" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <section class="view" id="v-debt"></section>
  <section class="view" id="v-load" hidden></section>
  <section class="view" id="v-close" hidden></section>
  <section class="view" id="v-asst" hidden></section>
</div>

<script>
/* ====== НАСТРОЙКА ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzyXwXJSB-OCnLfWCuJMiyNB4ZCpKVUKGTln-w4AKbDdnV4we7NHk71jkhIvGyQf-xu/exec';   // ссылка на веб-приложение Apps Script (…/exec)
const DEMO = null;           // null в рабочей версии
/* ======================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONF = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const hrs = n => (Math.round(n*10)/10).toLocaleString('ru-RU');
const mln = n => (n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:n>=1e7?1:2}) + ' млн';
const money = n => n >= 1e6 ? mln(n) + ' ₽' : fmt(n) + ' ₽';
const ym = s => { const [y,m] = s.split('-'); return MONF[+m-1] + ' ' + y; };
const dlong = s => { const [y,m,d] = s.split('-'); return (+d) + ' ' + MONG[+m-1]; };
const dshort = s => { const [y,m,d] = s.split('-'); return (+d) + ' ' + MON[+m-1]; };
const sum = (a,f) => a.reduce((s,x)=>s+f(x),0);

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#161616'); tg.setBackgroundColor('#161616'); } catch(e){} }

let D = null, view = 'debt';

/* ---------- data ---------- */
async function load(force){
  const btn = $('#refresh'); btn.classList.add('spin');
  try {
    if (DEMO) { D = demoRole === 'manager' ? {...DEMO, role:'manager', load:undefined} : {...DEMO, role:'admin'}; $('#demoNote').hidden = false; }
    else {
      if (!API_URL || API_URL.startsWith('__')) throw new Error('Не указана ссылка на Apps Script (API_URL).');
      const auth = tg && tg.initData ? tg.initData : '';
      if (!auth) throw new Error('Откройте приложение через бота в Telegram.');
      const r = await fetch(API_URL + '?auth=' + encodeURIComponent(auth) + (force ? '&refresh=1' : ''));
      const j = await r.json();
      if (j.error === 'forbidden') throw new Error('Нет доступа.' + (j.id ? ' Ваш Telegram ID: ' + j.id + ' — отправьте его Карине.' : ''));
      if (j.error) throw new Error(j.error);
      D = j;
    }
    $('#state').hidden = true;
    const t = new Date(D.updatedAt);
    $('#upd').innerHTML = 'Обновлено<br>' + t.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) + ', ' + t.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    const full = D.role !== 'manager' && !!D.load;
    $('#tab-load').hidden = !full;
    if (!full && view === 'load') view = 'debt';
    const pm = D.pulse && D.pulse.me || {};
    const asst = !!(pm.canEdit || pm.canGuide);
    $('#tab-asst').hidden = !asst;
    if (!asst && view === 'asst') view = 'close';
    renderDebt(); if (full) renderLoad(); renderClose(); if (asst) renderAsst(); show(view);
  } catch (e) {
    $('#state').hidden = false; $('#state').innerHTML = '<b>Данные не загрузились</b>' + esc(e.message);
    $('#upd').textContent = '';
  } finally { btn.classList.remove('spin'); }
}
$('#refresh').onclick = () => load(true);
let demoRole = 'admin';
['asAdmin','asManager'].forEach(id => $('#'+id).onclick = () => { demoRole = id==='asManager'?'manager':'admin';
  $('#asAdmin').setAttribute('aria-pressed', demoRole==='admin'); $('#asManager').setAttribute('aria-pressed', demoRole==='manager'); load(false); });

/* ---------- tabs ---------- */
const HEAD = {
  debt: () => ['Дебиторская <em>задолженность</em>', 'Срез на ' + dlong(D.debt.date) + ' · ' + D.debt.sheet],
  load: () => ['Нагрузка <em>команды</em>', ym(D.load.month) + ' · из личных таблиц сотрудников'],
  close: () => ['Закрытие <em>месяца</em>', 'Кто что держит, сроки и напоминания'],
  asst: () => ['Работа <em>ассистента</em>', 'Обязанности и справочник по документообороту']
};
function show(v){

function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function drawTrend(){
  const el = $('#trend'); if (!el || !el.offsetParent) return;
  const pts = D.debt.history; if (pts.length < 2) { el.innerHTML = '<div class="note">Мало данных для графика.</div>'; return; }
  const W = Math.max(el.clientWidth, 260), H = 190, L = 40, R = 14, T = 22, B = 24;
  const max = Math.max(...pts.map(p=>p[1])); const step = niceStep(max/4); const top = Math.ceil(max/step)*step;
  const x = i => L + i*(W-L-R)/(pts.length-1), y = v => T + (H-T-B)*(1 - v/top);
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v?(v/1e6)+'м':'0'}</text>`;
  const line = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const area = line + `L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  let xl = '', lastM = '', lastX = -99;
  pts.forEach((p,i)=>{ const m = p[0].slice(0,7); if (m !== lastM) { lastM = m; if (x(i) - lastX > 34 && i < pts.length-2) { xl += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${MON[+p[0].slice(5,7)-1]}</text>`; lastX = x(i); } } });
  const li = pts.length-1, lx = x(li), ly = y(pts[li][1]);
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Динамика дебиторской задолженности">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD400" stop-opacity=".30"/><stop offset="1" stop-color="#FFD400" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#FFD400" stroke-width="2" stroke-linejoin="round"/>
    ${xl}<rect x="${lx-5}" y="${ly-5}" width="10" height="10" fill="#FFD400" transform="rotate(45 ${lx} ${ly})"/>
    <text x="${lx-10}" y="${ly-10}" text-anchor="end" style="fill:var(--ink);font-weight:700">${mln(pts[li][1])}</text></svg>`;
}
function drawHours(){

const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dnum = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10))/864e5;

const plural = (n,a,b,c) => { n=Math.abs(n); const m10=n%10, m100=n%100; return m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c; };
const days = n => n+' '+plural(n,'день','дня','дней');

function monthDoc(){ return P().db['months/'+cmon] || null; }
function monthRows(){ const pre = 'months/'+cmon+'/rows/'; const db = P().db;
  return Object.keys(db).filter(p=>p.indexOf(pre)===0).map(p=>Object.assign({ id:p.slice(pre.length), path:p }, db[p])); }
function stepsFor(r){
  const s = [{k:'am', t: r.need ? 'От аккаунта: '+r.need : 'Материалы от аккаунта', who:'am', dl:'am'}];
  if (r.checker==='Аккаунт') s.push({k:'chk', t:'Аккаунт проверил приложение и суммы', who:'am', dl:'app'});

                           : {k:'appr', t:'Клиент согласовал приложение', who:'client'});
  if (r.entity==='ООО') { s.push({k:'bill', t:'Счёт отправлен бухгалтеру', who:'asst', dl:'docs'}); s.push({k:'upd', t:'УПД получен от бухгалтера', who:'acc'}); }
  else s.push({k:'docs', t:'Счёт и УПД подготовлены (номер из Контура, УПД на service-online)', who:'asst', dl:'docs'});
  s.push({k:'edo', t:'Выгружено в ЭДО', who:'asst', dl:'edo'});

}
function rowState(r){
  const steps = stepsFor(r), st = r.steps||{}, m = monthDoc()||{}, dl = m.dl||{};
  let cur = null, since = m.open || today(), doneN = 0;
  for (const s of steps){ const v = st[s.k]; if (v && (v.d||v.skip)) { doneN++; if (v.d && v.d > since) since = v.d; continue; } if (!cur) cur = s; }
  if (!cur) return { steps, cur:null, holder:'done', doneN, total:steps.length, late:0 };
  const due = cur.dl ? ((cur.k==='am' && r.amDue) ? r.amDue : dl[cur.dl] || null) : null;
  const t = today();
  return { steps, cur, holder:cur.who, doneN, total:steps.length, due, late: due ? Math.max(0, ddiff(t,due)) : 0, left: due ? ddiff(due,t) : null, wait: Math.max(0, ddiff(t,since)) };
}
function sortRows(list, byAm){
  const w = {}; HOLD_ORDER.forEach((k,i)=>w[k]=i);
  return list.map(r=>({r, s:rowState(r)})).sort((a,b)=>{
    if (byAm) { const c = (a.r.am||'').localeCompare(b.r.am||'','ru'); if (c) return c; return (a.r.order||0)-(b.r.order||0); }
    if (!!a.s.cur !== !!b.s.cur) return a.s.cur ? -1 : 1;
    if (b.s.late !== a.s.late) return b.s.late - a.s.late;
    const al = a.s.left==null?99:a.s.left, bl = b.s.left==null?99:b.s.left; if (al!==bl) return al-bl;
    if (w[a.s.holder]!==w[b.s.holder]) return w[a.s.holder]-w[b.s.holder];
    return (a.r.order||0)-(b.r.order||0);
  });
}

/* ---- запись на сервер (сначала меняем у себя, потом сохраняем) ---- */
async function api(op, payload, local){
  const me = P().me;
  if (local) { local(P().db); renderClose(); }
  if (DEMO) { toast('Демо: изменения не сохраняются'); return true; }
  try {
    const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ auth: tg.initData, op, month: cmon }, payload)) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    if (j.pulse) D.pulse = j.pulse;
    renderClose(); if (view==='asst') renderAsst();
    return j;
  } catch(e) {
    toast('Не сохранилось: ' + e.message); load(false); return false;
  }
}
function actorName(){ return P().me.name || 'Кто-то'; }
function mark(r, k, val, log){
  return api('step', { path:r.path, k, val, log }, db => {
    const row = db[r.path]; row.steps = Object.assign({}, row.steps||{});
    if (val===null) delete row.steps[k]; else row.steps[k] = Object.assign({}, val, { by: actorName() });
  });
}
function patch(r, fields, log){
  return api('patch', { path:r.path, fields, log }, db => { Object.assign(db[r.path], fields); });
}

/* ---- тексты напоминаний ---- */
function remindText(r, rs){
  const first = (r.am||'').split(' ')[0], ml = (monthDoc()||{}).label ? monthDoc().label.toLowerCase() : '';
  const due = rs.due ? (rs.late>0 ? 'Срок был '+dd(rs.due)+', уже '+days(rs.late)+' просрочки.' : 'Срок — '+dd(rs.due)+'.') : '';
  if (rs.cur && rs.cur.k==='appr') return first+', привет! По '+r.project+' за '+ml+' приложение у клиента на согласовании. Пришли, пожалуйста, его ответ или правки из чата — без этого не можем выгрузить документы в ЭДО.';
  if (rs.cur && rs.cur.k==='chk') return first+', привет! По '+r.project+' за '+ml+' нужна твоя проверка приложения и сумм перед отправкой клиенту. '+due;
  return first+', привет! Для закрытия за '+ml+' по проекту '+r.project+' жду от тебя: '+(r.need||'материалы для закрытия')+'. '+due+' Отметь, пожалуйста, «Сдал(а)» в Пульсе → Закрытие.';
}
function signText(r){
  const first = (r.am||'').split(' ')[0], ml = (monthDoc()||{}).label ? monthDoc().label.toLowerCase() : '';
  return first+', привет! По '+r.project+' за '+ml+' клиент ещё не подписал закрывающие в ЭДО. Напомни, пожалуйста, клиенту их подписать.';
}
function amHasTg(name){ return (P().team||[]).some(t => t.name===name && t.tg); }
async function sendReminder(r, text, btn){
  if (!amHasTg(r.am)) { copyText(text, btn && btn.parentElement.nextElementSibling); return; }
  if (btn) btn.disabled = true;
  const j = await api('remind', { path:r.path, text });
  if (btn) btn.disabled = false;
  if (j) { toast('Бот отправил напоминание: ' + r.am); try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }
}
function copyText(text, fb){
  const fallback = () => { if (!fb) return; fb.innerHTML = '<textarea class="fallback" readonly></textarea><div class="note">Выделите текст и скопируйте вручную.</div>'; const ta = fb.querySelector('textarea'); ta.value = text; ta.focus(); ta.select(); };
  try { navigator.clipboard.writeText(text).then(()=>toast('Текст скопирован'), fallback); } catch(e){ fallback(); }
}

  if (!cv) cv = me.canEdit ? 'mine' : 'mine';

    ${s.holder==='am'||s.cur&&s.cur.k==='chk'&&s.holder==='am'?`<div><div class="lbl" style="margin-bottom:8px">Напоминание аккаунту</div><div class="cnote" style="white-space:pre-wrap">${esc(remindText(r,s))}</div><div class="cact">${actBtn(amHasTg(r.am)?'Отправить через бота':'Скопировать', `data-remind="${esc(r.id)}"`)}</div><div class="fb"></div></div>`:''}
    <div><div class="lbl" style="margin-bottom:8px">Подпись клиента в ЭДО</div>
      <div class="note" style="margin:0 0 8px">${r.clientSigned?'Клиент подписал'+(r.clientSigned.d?' · '+dd(r.clientSigned.d):'')+(r.clientSigned.by?' · '+esc(r.clientSigned.by):''):'Ещё не подписал. Закрытие этого не ждёт.'}</div>
      <div class="cact">${r.clientSigned?`<button class="clink" id="unsign">Снять отметку</button>`:actBtn('Клиент подписал','id="signed"','ghost')+(r.am?actBtn(amHasTg(r.am)?'Попросить аккаунта напомнить':'Скопировать просьбу аккаунту', `data-remindsign="${esc(r.id)}"`):'')}</div><div class="fb"></div></div>
    <div><div class="lbl" style="margin-bottom:8px">Смета / отчёт</div>
      ${link?`<div class="s" style="margin-bottom:8px"><a href="${esc(link)}" target="_blank" rel="noopener" style="color:var(--y)">${esc(link)}</a></div>`:''}
      <div class="cact"><input class="search" id="pLink" value="${esc(link||'')}" placeholder="Ссылка на смету или отчёт" style="margin:0">${actBtn('Сохранить','id="saveLink"','ghost')}</div></div>
    <div><div class="lbl" style="margin-bottom:8px">Комментарий</div><textarea class="search" id="pComment" rows="3" placeholder="Например: клиент просит пока не выгружать">${esc(r.comment||'')}</textarea>${actBtn('Сохранить комментарий','id="saveComment"','ghost')}</div>
    <div><div class="lbl" style="margin-bottom:8px">Перенос суммы на следующий месяц</div><div class="cact"><input class="search" id="pCarry" value="${esc(r.carry||'')}" placeholder="Что и сколько переносим" style="margin:0">${actBtn('Сохранить','id="saveCarry"','ghost')}</div></div>
    <div><div class="lbl" style="margin-bottom:8px">Кто согласует</div>${me.canEdit?`<form id="apprForm" class="cform">
      <label>Проверка до отправки<select id="pChecker">${CHECKERS.map(c=>`<option${(r.checker||'не нужна')===c?' selected':''}>${c}</option>`).join('')}</select></label>
      <label>Согласование с клиентом<select id="pChannel">${[CH_MAIL,CH_AM].map(c=>`<option${(r.channel||CH_MAIL)===c?' selected':''}>${c}</option>`).join('')}</select></label>
      <label>Кто согласует у клиента<input id="pClient" value="${esc(r.clientApprover||'')}" placeholder="Имя, должность"></label>
      <button class="copy ghost" type="submit">Сохранить</button></form>`:`<div class="note" style="margin:0">${esc(approvalLine(r))}</div>`}</div>
    <div><div class="lbl" style="margin-bottom:8px">Данные</div><div class="s">Юрлицо клиента: ${esc(r.payer||'—')}<br>Наше юрлицо: ${r.entity==='ООО'?'ООО «Ра Цифровые проекты» — УПД делает бухгалтер':'ИП Гречковский А. О. — счёт, УПД и приложение готовим сами'}<br>От аккаунта: ${esc(r.need||'ничего, только коммуникация')}</div>
      ${me.canEdit?`<button class="clink" id="delRow" style="color:var(--red);margin-top:10px">${delSure?'Точно удалить? Нажмите ещё раз':'Удалить строку из месяца'}</button>`:''}</div>
    ${log?`<div><div class="lbl" style="margin-bottom:8px">История</div>${log}</div>`:''}
  </div>`;
}

/* ---- события ---- */
function bindClose(){
  const root = $('#v-close'), rows = monthRows(), find = id => rows.find(x=>x.id===id), me = P().me;
  root.onclick = async e => {
    const b = e.target.closest('button,[data-open],[data-close]'); if (!b) return;
    const d = b.dataset;
    if (d.cv) { cv = d.cv; openRow = null; renderClose(); return; }
    if (d.cm) { cmon = d.cm; openRow = null; renderClose(); return; }
    if (d.arch) { cm = +d.arch; renderClose(); return; }
    if (d.h) { cfHolder = cfHolder===d.h ? null : d.h; cv = 'board'; renderClose(); return; }
    if (d.am !== undefined) { cfAm = d.am || null; renderClose(); return; }
    if (b.hasAttribute('data-close')) { openRow = null; delSure = false; renderClose(); return; }
    if (d.remind) { const r = find(d.remind); await sendReminder(r, remindText(r, rowState(r)), b); return; }
    if (d.remindsign) { const r = find(d.remindsign); await sendReminder(r, signText(r), b); return; }
    if (d.signed) { const r = find(d.signed); await patch(r, { clientSigned:{ d:today() } }, 'клиент подписал закрывающие в ЭДО'); return; }
    if (d.amdone) { const r = find(d.amdone), inp = $('#lnk-'+CSS.escape(r.id)); const v = { d:today() }; if (inp && inp.value.trim()) v.link = inp.value.trim();
      await mark(r, 'am', v, 'готово: «'+rowState(r).cur.t+'»'); toast('Отмечено — ассистент видит'); return; }
    if (d.step) { const [id,k] = d.step.split('|'), r = find(id), s = rowState(r).steps.find(x=>x.k===k), prev = (r.steps||{})[k]||{};
      await mark(r, k, Object.assign({}, prev, { d:today(), skip:false }), 'готово: «'+s.t+'»'); return; }
    if (d.open && !e.target.closest('button,input,textarea,a')) { openRow = d.open; delSure = false; renderClose(); return; }
    const r = find(openRow); if (!r) return;
    const stepT = k => (rowState(r).steps.find(x=>x.k===k)||{}).t;
    if (d.mark) { const prev = (r.steps||{})[d.mark]||{}; await mark(r, d.mark, Object.assign({}, prev, { d:today(), skip:false }), 'готово: «'+stepT(d.mark)+'»'); return; }
    if (d.skip) { await mark(r, d.skip, { skip:true }, 'шаг «'+stepT(d.skip)+'» не требуется'); return; }
    if (d.undo) { const prev = (r.steps||{})[d.undo]||{}; await mark(r, d.undo, prev.link ? { link:prev.link } : null, 'снят шаг «'+stepT(d.undo)+'»'); return; }
    if (b.id==='unsign') { await patch(r, { clientSigned:false }, 'снята отметка о подписи клиента'); return; }
    if (b.id==='saveComment') { await patch(r, { comment: $('#pComment').value.trim() }, 'обновлён комментарий'); toast('Сохранено'); return; }
    if (b.id==='saveCarry') { await patch(r, { carry: $('#pCarry').value.trim() }, 'обновлён перенос суммы'); toast('Сохранено'); return; }
    if (b.id==='saveLink') { const prev = (r.steps||{}).am; const v = Object.assign({}, prev||{}, { link: $('#pLink').value.trim() });
      await mark(r, 'am', v, 'обновлена ссылка на смету/отчёт'); toast('Сохранено'); return; }
    if (b.id==='delRow') { if (!delSure) { delSure = true; renderClose(); return; } openRow = null; delSure = false;
      await api('delete', { path:r.path }, db => { delete db[r.path]; }); toast('Строка удалена'); return; }
  };
  root.onkeydown = e => { const t = e.target; if (t.dataset && t.dataset.open && (e.key==='Enter'||e.key===' ') && t === e.target) { e.preventDefault(); openRow = t.dataset.open; renderClose(); }
    if (e.key==='Escape' && openRow) { openRow = null; renderClose(); } };
  root.onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    if (f.id==='dlForm') { const dl = {}; Object.keys(DL_LABEL).forEach(k=>{ const v = $('#dl-'+k).value; if (v) dl[k]=v; });
      await api('patch', { path:'months/'+cmon, fields:{ dl } }, db => { db['months/'+cmon].dl = dl; }); toast('Сроки сохранены'); }
    if (f.id==='addForm') { const p = $('#a-project').value.trim(); if (!p) return;
      const id = 'r' + Date.now().toString(36), path = 'months/'+cmon+'/rows/'+id;
      const data = { project:p, am:$('#a-am').value, entity:$('#a-entity').value, kind:$('#a-kind').value, need:$('#a-need').value.trim(), payer:$('#a-payer').value.trim(),
        channel:$('#a-channel').value, checker:'не нужна', info:'', comment:'', order: monthRows().length+1, steps:{} };
      if (!data.need) data.steps = { am:{ skip:true } };
      await api('set', { path, data }, db => { db[path] = Object.assign({ log:[] }, data); }); f.reset(); toast('«'+p+'» добавлен'); }
    if (f.id==='apprForm') { const r = find(openRow); if (!r) return; const checker = $('#pChecker').value;
      const fields = { checker, channel:$('#pChannel').value, clientApprover:$('#pClient').value.trim() };
      await patch(r, fields, 'обновлено, кто согласует'); toast('Сохранено'); }
  };
  const nm = $('#newMonth'); if (nm) nm.onclick = async () => {
    nm.disabled = true; const n = nextMonthInfo(); let cy = n.y, cmo = n.mo+1; if (cmo>12) { cmo=1; cy++; }
    const d = day => cy+'-'+String(cmo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const j = await api('newMonth', { from:cmon, to:n.id, label:n.label, open:d(1), dl:{ am:d(3), app:d(5), docs:d(7), edo:d(10) } });
    if (j) { cmon = n.id; renderClose(); toast(n.label+' открыт'); }
  };
}

/* ---------- Ассистент: обязанности и справочник ---------- */
let av = 'duties', aEdit = null;
const GROUPS = { daily:['Каждый день','сегодня'], weekly:['Каждую неделю','на этой неделе'], monthly:['Каждый месяц','в этом месяце'], quarterly:['Раз в квартал','в этом квартале'] };
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return t.getUTCFullYear()+'-W'+String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,'0'); }
function periodKeys(){ const d = new Date(), ym = today().slice(0,7);
  return { daily:'d-'+today(), weekly:'w-'+isoWeek(d), monthly:'m-'+ym, quarterly:'q-'+ym.slice(0,4)+'-Q'+(Math.floor((d.getMonth())/3)+1) }; }
function md(text){
  let html = '', list = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+[^\s<.,;:)])/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--y)">$1</a>');
  String(text||'').split('\n').forEach(raw => { const l = raw.trim();
    if (l.startsWith('- ')) { if (!list) { html += '<ul>'; list = true; } html += '<li>'+inline(l.slice(2))+'</li>'; return; }
    if (list) { html += '</ul>'; list = false; } if (!l) return;
    html += l.startsWith('## ') ? '<h3>'+inline(l.slice(3))+'</h3>' : '<p>'+inline(l)+'</p>'; });
  return html + (list ? '</ul>' : '');
}
function renderAsst(){
  const p = P(), me = p.me, db = p.db;
  const secs = Object.keys(db).filter(k=>/^guide\//.test(k) && k!=='guide/duties').map(k=>Object.assign({ id:k.slice(6) }, db[k])).sort((a,b)=>(a.order||0)-(b.order||0));
  let h = `<div class="chips">${[['duties','Обязанности'],['guide','Справочник']].map(([k,l])=>`<button class="chip" data-av="${k}" aria-pressed="${av===k}">${l}</button>`).join('')}</div>`;
  if (av === 'duties') {
    const dt = db['guide/duties'] || {}, keys = periodKeys();
    if (aEdit === 'duties') {
      h += `<form id="dutiesForm" class="grid">${Object.keys(GROUPS).map(g=>`<div class="card"><h2>${GROUPS[g][0]}</h2><textarea class="search" id="du-${g}" rows="7">${esc((dt[g]||[]).map(x=>x.t+(x.n?' — '+x.n:'')).join('\n'))}</textarea></div>`).join('')}
        <div class="cact"><button class="copy" type="submit">Сохранить</button><button class="clink" type="button" data-cancel>Отмена</button></div></form>`;
    } else {
      h += `<div class="note" style="margin:0 0 4px">Отметки сбрасываются сами: каждый день, по понедельникам, 1 числа и с началом квартала.${me.canGuide?' <button class="clink" data-edit="duties">Изменить список</button>':''}</div>`;
      h += '<div class="grid two">' + Object.keys(GROUPS).map(g=>{ const items = dt[g]||[], done = (db['checks/'+keys[g]]||{}).items || {};
        const n = items.filter(x=>done[x.id]).length;
        return `<div class="card"><h2>${GROUPS[g][0]} <small>${n} из ${items.length} ${GROUPS[g][1]}</small></h2><div class="list">${items.map(x=>{ const v = done[x.id];
          return `<label class="row cduty ${v?'ok':''}"><span><span class="t">${esc(x.t)}</span>${x.n?`<span class="s" style="display:block">${esc(x.n)}</span>`:''}${v?`<span class="s" style="display:block">${esc(v.by)} · ${dd(v.at.slice(0,10))}</span>`:''}</span>
            <input type="checkbox" data-duty="${g}|${esc(x.id)}"${v?' checked':''}></label>`; }).join('') || '<div class="note">Пусто</div>'}</div></div>`; }).join('') + '</div>';
    }
  } else {
    h += secs.map(s => aEdit === s.id
      ? `<div class="card"><form id="guideForm" data-sec="${esc(s.id)}" class="grid"><input class="search" id="gTitle" value="${esc(s.title)}"><textarea class="search" id="gBody" rows="14">${esc(s.body||'')}</textarea>
          <div class="note">«- » в начале строки — пункт списка, «## » — подзаголовок, **текст** — жирный.</div><div class="cact"><button class="copy" type="submit">Сохранить</button><button class="clink" type="button" data-cancel>Отмена</button></div></form></div>`
      : `<div class="card"><h2>${esc(s.title)}${me.canGuide?` <button class="clink" data-edit="${esc(s.id)}">Изменить</button>`:''}</h2><div class="cprose">${md(s.body)}</div></div>`).join('') || '<div class="card"><div class="note">Справочник пока пуст.</div></div>';
  }
  $('#v-asst').innerHTML = h;
  const root = $('#v-asst');
  root.onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.av) { av = b.dataset.av; aEdit = null; renderAsst(); }
    if (b.dataset.edit) { aEdit = b.dataset.edit; renderAsst(); }
    if (b.hasAttribute('data-cancel')) { aEdit = null; renderAsst(); } };
  root.onchange = async e => { const t = e.target; if (!t.dataset.duty) return;
    const [g,id] = t.dataset.duty.split('|'), key = periodKeys()[g], path = 'checks/'+key;
    const items = Object.assign({}, (P().db[path]||{}).items || {});
    if (t.checked) items[id] = { by: actorName(), at: new Date().toISOString() }; else delete items[id];
    await api('set', { path, data:{ items } }, db => { db[path] = { items }; }); renderAsst(); };
  root.onsubmit = async e => { e.preventDefault(); const f = e.target;
    if (f.id==='guideForm') { const id = f.dataset.sec; await api('patch', { path:'guide/'+id, fields:{ title:$('#gTitle').value.trim(), body:$('#gBody').value } }); aEdit = null; renderAsst(); toast('Раздел сохранён'); }
    if (f.id==='dutiesForm') { const out = {}, old = P().db['guide/duties'] || {};
      Object.keys(GROUPS).forEach(g => { out[g] = $('#du-'+g).value.split('\n').map(s=>s.trim()).filter(Boolean).map((line,i)=>{ const [t,...rest] = line.split(' — ');
        const prev = (old[g]||[]).find(x=>x.t===t.trim()); return { id: prev ? prev.id : g[0]+Date.now().toString(36)+i, t:t.trim(), n:rest.join(' — ').trim() }; }); });
      await api('set', { path:'guide/duties', data: out }); aEdit = null; renderAsst(); toast('Список сохранён'); } };
}

try { const t = localStorage.getItem('tab'); if (['debt','load','close','asst'].includes(t)) view = t; } catch(e){}
load(false);
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ if (D) { drawTrend(); drawHours(); } }, 150); });
</script>
